<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="1點點组家长成员目录与沉浸式自我介绍">
  <title>1點點</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Inter:wght@400;500;700&family=LXGW+WenKai+TC&family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #383838;
      --muted: #777;
      --paper: #fffdf8;
      --soft: #f8f4eb;
      --cream: #fcf8f0;
      --cream-deep: #f3eadc;
      --red: #b8453b;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--soft);
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, a { color: inherit; font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 2px solid #333; outline-offset: 5px; }
    [hidden] { display: none !important; }

    .app-view {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity .32s ease, transform .32s ease, visibility 0s linear .32s;
    }
    .app-view.is-active {
      z-index: 10;
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
      transition-delay: 0s;
    }
    .view-label {
      position: absolute;
      z-index: 40;
      top: 28px;
      right: 38px;
      margin: 0;
      color: #aaa;
      font-family: "Architects Daughter", cursive;
      font-size: 11px;
      letter-spacing: .12em;
    }
    .back-control {
      position: absolute;
      z-index: 40;
      top: 28px;
      left: 40px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 0;
      border: 0;
      background: transparent;
      color: #666;
      font-family: "Permanent Marker", cursive;
      font-size: 14px;
      text-decoration: none;
      opacity: .66;
      transition: .2s ease;
    }
    .back-control:hover { color: #111; opacity: 1; transform: translateX(-4px); }

    /* ==================== 01 首页 ==================== */
    .home-view {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
    }
    .home-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .home-view .deco-icon {
      position: absolute;
      fill: none;
      stroke: #888;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .55;
      pointer-events: none;
    }
    .icon-leaf { top: 12%; left: 12%; width: 45px; height: 45px; transform: rotate(-15deg); }
    .icon-balloon { top: 15%; right: 28%; width: 50px; height: 50px; transform: rotate(5deg); }
    .icon-star { top: 22%; right: 12%; width: 35px; height: 35px; transform: rotate(15deg); }
    .icon-house { top: 42%; left: 8%; width: 60px; height: 60px; transform: rotate(-3deg); }
    .icon-planet { top: 48%; right: 6%; width: 55px; height: 55px; transform: rotate(-10deg); }
    .icon-group { bottom: 15%; left: 16%; width: 75px; height: 75px; transform: rotate(-4deg); }
    .icon-photo { right: 18%; bottom: 12%; width: 65px; height: 65px; transform: rotate(6deg); }
    .home-title {
      margin: 0;
      color: #383838;
      font-family: "Permanent Marker", cursive;
      font-size: clamp(3.5rem, 7vw, 6.5rem);
      line-height: 1.25;
      text-transform: uppercase;
      text-shadow: 5px 6px 0 #b3b3b3;
      transform: rotate(-1deg);
    }
    .home-title span { display: block; }
    .home-subtitle {
      margin: 35px 0 58px .9em;
      color: #4a4a4a;
      font-family: "Architects Daughter", cursive;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .9em;
      text-transform: uppercase;
    }
    .home-nav { display: flex; gap: 50px; }
    .text-link {
      padding: 7px 0;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: #666;
      font-size: .95rem;
      letter-spacing: .5px;
      transition: .24s ease;
    }
    .text-link:hover { color: #222; border-color: #777; transform: translateY(-2px); }
    .home-hint {
      position: absolute;
      z-index: 10;
      bottom: 24px;
      left: 50%;
      color: #999;
      font-family: "Architects Daughter", cursive;
      font-size: 11px;
      letter-spacing: .08em;
      transform: translateX(-50%);
    }

    /* ==================== 02 成员分组 ==================== */
    .groups-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 40px 46px;
      background: #f8f4ec;
    }
    .groups-header { position: relative; z-index: 10; margin-bottom: 48px; text-align: center; }
    .groups-title {
      margin: 0;
      color: #333;
      font-family: "Permanent Marker", cursive;
      font-size: clamp(2.9rem, 5vw, 3.6rem);
      letter-spacing: 2px;
      text-shadow: 4px 4px 0 rgba(0,0,0,.08);
      transform: rotate(-1deg);
    }
    .groups-note { margin: 10px 0 0; color: #888; font-family: "LXGW WenKai TC", sans-serif; font-size: 13px; }
    .groups-gallery {
      position: relative;
      z-index: 10;
      display: flex;
      width: min(900px, calc(100vw - 80px));
      height: 420px;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }
    .group-card {
      position: relative;
      display: flex;
      width: 85px;
      height: 100%;
      flex: 0 1 auto;
      align-items: flex-end;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,.06);
      transition: all .6s cubic-bezier(.25,1,.5,1);
    }
    .group-card:hover, .group-card:focus-visible {
      width: 400px;
      box-shadow: 0 15px 35px rgba(0,0,0,.12);
      transform: translateY(-5px);
    }
    .group-card:nth-child(1) { background: #c4a495; }
    .group-card:nth-child(2) { background: #99a897; }
    .group-card:nth-child(3) { background: #8a9bae; }
    .group-card:nth-child(4) { background: #bbafab; }
    .group-index {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      color: rgba(255,255,255,.9);
      font-family: "Permanent Marker", cursive;
      font-size: 1.8rem;
      transform: translate(-50%,-50%);
      transition: opacity .3s ease;
    }
    .group-title {
      position: relative;
      z-index: 2;
      padding: 30px;
      color: #fff;
      font-family: "LXGW WenKai TC", sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(15px);
      transition: all .4s ease .2s;
    }
    .group-hint {
      position: absolute;
      z-index: 3;
      top: 22px;
      right: 22px;
      color: rgba(255,255,255,.85);
      font-family: "Architects Daughter", cursive;
      font-size: 11px;
      opacity: 0;
      transition: opacity .35s ease .25s;
    }
    .group-card:hover .group-index, .group-card:focus-visible .group-index { opacity: 0; }
    .group-card:hover .group-title, .group-card:focus-visible .group-title,
    .group-card:hover .group-hint, .group-card:focus-visible .group-hint { opacity: 1; transform: translateY(0); }
    .group-card.is-pending { cursor: not-allowed; }
    .group-card.is-pending::after {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.04);
      content: "";
    }

    /* ==================== 03 成员目录 ==================== */
    .directory-view {
      overflow-y: auto;
      background: var(--soft);
      padding: 76px 20px 56px;
    }
    .directory-watermark {
      position: fixed;
      z-index: 0;
      top: 50%;
      left: 50%;
      color: rgba(0,0,0,.02);
      font-family: "Permanent Marker", cursive;
      font-size: 15rem;
      letter-spacing: 10px;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%,-50%);
    }
    .directory-sheet {
      position: relative;
      z-index: 10;
      width: min(1100px, 100%);
      min-height: calc(100svh - 132px);
      margin: 0 auto;
      padding: 55px 80px 76px;
      background: var(--paper);
      border: 1.5px solid #222;
      border-radius: 8px 12px 10px 8px / 12px 8px 14px 10px;
      box-shadow: 0 15px 40px rgba(0,0,0,.05);
    }
    .directory-header { position: relative; margin-bottom: 52px; text-align: center; }
    .directory-title { margin: 0 0 8px; color: #222; font-family: "LXGW WenKai TC", sans-serif; font-size: 2.5rem; font-weight: 700; }
    .directory-subtitle { color: #888; font-family: "Permanent Marker", cursive; font-size: 1.05rem; letter-spacing: 2px; }
    .directory-divider { width: 80px; margin: 23px auto 0; border-bottom: 2px dashed #ccc; }
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 48px 36px;
      padding: 18px 0;
    }
    .member-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 12px 25px;
      border: 1px solid #f0f0f0;
      background: #fff;
      box-shadow: 0 6px 15px rgba(0,0,0,.06);
      text-align: center;
      transition: all .4s cubic-bezier(.34,1.56,.64,1);
    }
    .member-card:nth-child(odd) { transform: rotate(-3deg); }
    .member-card:nth-child(even) { transform: rotate(2.5deg); }
    .member-card:nth-child(3n) { transform: rotate(-1.5deg); }
    .member-card:hover, .member-card:focus-visible {
      z-index: 10;
      border-color: #e4e4e4;
      box-shadow: 0 15px 30px rgba(0,0,0,.12);
      transform: rotate(0) scale(1.06) !important;
    }
    .card-tape {
      position: absolute;
      z-index: 2;
      top: -10px;
      left: 50%;
      width: 60px;
      height: 20px;
      background: #f4f4f4;
      border: 1px solid #eaeaea;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      transform: translateX(-50%) rotate(-1deg);
    }
    .member-card:nth-child(even) .card-tape { transform: translateX(-50%) rotate(2deg); }
    .card-image, .card-placeholder {
      display: block;
      width: 100%;
      height: 205px;
      margin-bottom: 15px;
      object-fit: cover;
    }
    .card-placeholder {
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.84);
      font-family: "Permanent Marker", cursive;
      font-size: 2.2rem;
      letter-spacing: .05em;
    }
    .member-name { margin-bottom: 5px; color: #222; font-family: "LXGW WenKai TC", sans-serif; font-size: 1.3rem; font-weight: 700; }
    .member-role { color: #777; font-size: .78rem; letter-spacing: .5px; text-transform: uppercase; }
    .member-enter { margin-top: 11px; color: #aaa; font-family: "Architects Daughter", cursive; font-size: 10px; }
    .directory-doodle {
      position: absolute;
      fill: none;
      stroke: #999;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .4;
      pointer-events: none;
    }
    .directory-star { top: 40px; right: 50px; width: 30px; transform: rotate(15deg); }
    .directory-swirl { bottom: 30px; left: 40px; width: 40px; transform: rotate(-10deg); }

    /* ==================== 04 沉浸式成员介绍 ==================== */
    .reader-view {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 94px;
      background: var(--soft);
      perspective: 1400px;
    }
    .reader-top {
      position: absolute;
      z-index: 45;
      top: 26px;
      right: 38px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .reader-progress { color: #666; font-family: "Permanent Marker", cursive; font-size: 14px; letter-spacing: .08em; }
    .directory-button {
      padding: 6px 0;
      border: 0;
      border-bottom: 1px solid #999;
      background: transparent;
      color: #777;
      font-family: "Architects Daughter", cursive;
      font-size: 12px;
    }
    .music-toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid rgba(0,0,0,.14);
      border-radius: 50%;
      background: rgba(255,253,248,.94);
      color: var(--red);
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .music-toggle:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.14); }
    .music-toggle svg { width: 15px; height: 15px; }
    .music-eq {
      display: none;
      align-items: flex-end;
      gap: 2.5px;
      height: 13px;
    }
    .music-eq i {
      display: block;
      width: 2.5px;
      border-radius: 2px;
      background: currentColor;
      transform-origin: bottom;
      animation: musicBounce 1s ease-in-out infinite;
    }
    .music-eq i:nth-child(1) { height: 5px; }
    .music-eq i:nth-child(2) { height: 12px; animation-delay: .18s; }
    .music-eq i:nth-child(3) { height: 8px; animation-delay: .36s; }
    .music-toggle.is-playing svg { display: none; }
    .music-toggle.is-playing .music-eq { display: inline-flex; }
    @keyframes musicBounce {
      0%, 100% { transform: scaleY(.55); }
      50% { transform: scaleY(1); }
    }
    .reader-watermark {
      position: absolute;
      z-index: 0;
      top: 50%;
      left: 50%;
      color: #000;
      font-family: "Permanent Marker", cursive;
      font-size: clamp(6rem, 13vw, 12rem);
      line-height: .9;
      text-align: center;
      white-space: nowrap;
      opacity: .03;
      filter: blur(8px);
      pointer-events: none;
      transform: translate(-50%,-50%);
    }
    .notebook-container {
      position: relative;
      z-index: 10;
      display: flex;
      width: min(1000px, calc(100vw - 188px));
      height: min(560px, calc(100svh - 140px));
      min-height: 520px;
      background: var(--paper);
      border: 1.5px solid #222;
      border-radius: 8px 12px 10px 8px / 12px 8px 14px 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.04);
      transform: skewX(-.3deg) skewY(.2deg);
      transform-style: preserve-3d;
    }
    .notebook-container.turn-next { animation: turnNext .42s ease; }
    .notebook-container.turn-prev { animation: turnPrev .42s ease; }
    @keyframes turnNext {
      0% { opacity: 1; transform: skewX(-.3deg) skewY(.2deg) rotateY(0); }
      48% { opacity: .45; transform: skewX(-.3deg) skewY(.2deg) rotateY(-7deg) translateX(-18px); }
      100% { opacity: 1; transform: skewX(-.3deg) skewY(.2deg) rotateY(0); }
    }
    @keyframes turnPrev {
      0% { opacity: 1; transform: skewX(-.3deg) skewY(.2deg) rotateY(0); }
      48% { opacity: .45; transform: skewX(-.3deg) skewY(.2deg) rotateY(7deg) translateX(18px); }
      100% { opacity: 1; transform: skewX(-.3deg) skewY(.2deg) rotateY(0); }
    }
    .notebook-spine { position: absolute; z-index: 1; top: 4%; bottom: 4%; left: 50%; width: 1px; border-left: 1px dotted #aaa; }
    .notebook-page {
      position: relative;
      z-index: 5;
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      padding: 44px 56px;
      transform: skewX(.3deg) skewY(-.2deg);
    }
    .reader-left { align-items: center; }
    .reader-right { justify-content: flex-start; padding: 66px 48px 54px 68px; overflow-y: auto; }
    .polaroid {
      position: relative;
      width: min(290px, 84%);
      margin: 0;
      padding: 15px 15px 58px;
      background: #fff;
      border: 1px solid #f3f3f3;
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
      transform: rotate(-2deg);
    }
    .profile-image, .profile-placeholder {
      display: block;
      width: 100%;
      height: 315px;
      object-fit: cover;
    }
    .profile-placeholder {
      display: grid;
      place-items: center;
      color: rgba(255,255,255,.86);
      font-family: "Permanent Marker", cursive;
      font-size: 3.2rem;
    }
    .polaroid figcaption {
      position: absolute;
      right: 15px;
      bottom: 18px;
      left: 15px;
      color: #777;
      font-family: "Architects Daughter", cursive;
      font-size: 11px;
      text-align: center;
    }
    .tape {
      position: absolute;
      z-index: 2;
      top: -12px;
      left: 50%;
      width: 75px;
      height: 25px;
      background: #f4f4f4;
      border: 1px solid #eaeaea;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
      transform: translateX(-50%);
    }
    .intro-title { margin: 0 0 26px; color: #111; font-family: "LXGW WenKai TC", sans-serif; font-size: clamp(1.55rem, 3vw, 2rem); font-weight: 700; letter-spacing: -.5px; }
    .intro-subtitle { margin: 0 0 28px; color: #777; font-size: .96rem; }
    .intro-body { margin: 0; color: #444; font-family: "LXGW WenKai TC", sans-serif; font-size: .9rem; line-height: 1.82; white-space: pre-wrap; overflow-wrap: anywhere; }
    .intro-body.intro-short { font-size: clamp(1.12rem, 2.1vw, 1.3rem); line-height: 2; }
    .intro-body.intro-medium { font-size: clamp(1rem, 1.6vw, 1.12rem); line-height: 1.92; }
    .intro-body.intro-standard { font-size: .96rem; line-height: 1.86; }
    .intro-body.intro-long { font-size: .88rem; line-height: 1.8; }
    .reader-right.is-brief { justify-content: center; }
    .reader-right.is-brief .intro-title { margin-bottom: 30px; }
    .social-section { margin-top: 18px; }
    .social-section > p { margin: 0 0 15px; color: #777; font-size: .86rem; }
    .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 8px; }
    .social-item { display: flex; align-items: center; gap: 9px; color: #333; font-size: .82rem; }
    .red-icon { display: inline-block; width: 13px; height: 15px; flex: 0 0 auto; border-radius: 4px 4px 2px 2px; background: #c0392b; }
    .binder-rings {
      position: absolute;
      z-index: 20;
      top: 50%;
      left: 50%;
      display: flex;
      flex-direction: column;
      gap: 76px;
      transform: translate(-50%,-50%);
    }
    .ring-svg { width: 60px; height: 25px; overflow: visible; }
    .page-arrow {
      position: absolute;
      z-index: 35;
      top: 50%;
      display: grid;
      width: 66px;
      height: 66px;
      place-items: center;
      border: 1.5px solid #666;
      border-radius: 50% 46% 52% 48%;
      background: rgba(255,253,248,.82);
      color: #555;
      box-shadow: 0 5px 18px rgba(0,0,0,.04);
      transform: translateY(-50%) rotate(-3deg);
      transition: .22s ease;
    }
    .page-arrow:hover { background: #fffdf8; color: #111; box-shadow: 0 9px 24px rgba(0,0,0,.09); transform: translateY(-50%) scale(1.07) rotate(0); }
    .page-arrow svg { width: 31px; height: 31px; }
    .page-arrow.prev { left: 24px; }
    .page-arrow.next { right: 24px; }
    .arrow-label {
      position: absolute;
      top: calc(50% + 48px);
      color: #999;
      font-family: "Architects Daughter", cursive;
      font-size: 10px;
      white-space: nowrap;
      transform: translateY(-50%);
    }
    .arrow-label.prev { left: 26px; }
    .arrow-label.next { right: 26px; }

    .notice {
      position: fixed;
      z-index: 200;
      bottom: 30px;
      left: 50%;
      max-width: calc(100vw - 40px);
      padding: 12px 18px;
      border: 1px solid #ddd;
      border-radius: 99px;
      background: rgba(255,253,248,.96);
      color: #666;
      box-shadow: 0 8px 25px rgba(0,0,0,.1);
      font-family: "LXGW WenKai TC", sans-serif;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 16px);
      transition: .25s ease;
    }
    .notice.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 820px) {
      .view-label { top: 20px; right: 20px; }
      .back-control { top: 18px; left: 20px; }
      .home-view .deco-icon { opacity: .3; }
      .icon-leaf { top: 5%; left: 5%; width: 35px; height: 35px; }
      .icon-balloon { top: 8%; right: 15%; width: 40px; height: 40px; }
      .icon-star { top: 15%; right: 5%; width: 25px; height: 25px; }
      .icon-house { top: 35%; left: 3%; width: 45px; height: 45px; }
      .icon-planet { top: 38%; right: 3%; width: 45px; height: 45px; }
      .icon-group { bottom: 8%; left: 5%; width: 55px; height: 55px; }
      .icon-photo { right: 5%; bottom: 8%; width: 50px; height: 50px; }
      .home-title { font-size: clamp(3rem, 16vw, 5rem); }
      .home-subtitle { margin-bottom: 42px; margin-left: .5em; font-size: .82rem; letter-spacing: .5em; }
      .home-nav { gap: 24px; }
      .home-hint { display: none; }

      .groups-view { padding: 76px 18px 40px; }
      .groups-header { margin-bottom: 28px; }
      .groups-gallery { width: 100%; height: 60svh; gap: 8px; }
      .group-card { width: 54px; border-radius: 12px; }
      .group-card:hover, .group-card:focus-visible { width: 55%; }

      .reader-view { display: block; overflow-y: auto; padding: 75px 16px 92px; }

      .group-index { top: 16px; left: 16px; font-size: 1.1rem; transform: none; }

      .directory-view { padding: 62px 0 30px; }

      .members-grid { gap: 24px 12px; padding: 12px 0; }

      .card-image, .card-placeholder { height: clamp(138px, 43vw, 174px); margin-bottom: 11px; }

      .reader-view { padding: 64px 12px calc(122px + env(safe-area-inset-bottom)); scroll-padding-bottom: 122px; }

      .notebook-page { padding: 28px 18px; }
      .reader-left { padding-bottom: 30px; }
      .reader-right { padding: 32px 20px 46px; }
      .polaroid { width: min(286px, 84vw); padding: 12px 12px 48px; }
      .profile-image, .profile-placeholder { height: min(320px, 84vw); }

      .intro-title { margin-bottom: 20px; font-size: clamp(1.35rem, 6.2vw, 1.75rem); }

      .page-arrow {
        position: fixed;
        top: auto;
        bottom: calc(6px + env(safe-area-inset-bottom));

    @media (prefers-reduced-motion: reduce) {

":"组曾姥爷","name":"红烧糖醋鲤鱼","title":"组曾姥爷-红烧糖醋鲤鱼","group":"elder","intro":"在我所有重要的毫无意义的事里面，我应该先告诉你哪一件呢？\n\n……\n\n哈咯哈咯大家好这个人是组曾姥爷·红烧糖醋鲤鱼·康普·中国，专业是COMP简称康普，来自香港，暑假在美国费城（可能要九月才能跟大家见面！），爱好是编辑朋友圈、发送朋友圈、以及置顶朋友圈。那么大家可能会想：这个人怎么这么奇怪，他的朋友圈里到底有啥呢？就让我们一起来看看吧！\n\n如果有人问：能不能用几个形容词形容这个人？那么我会说他就是一个忧郁的、叛逆的、反叛的、摇滚的、愤怒的、虚无的、理性的、犬儒的、批判的、尖锐的、沉思的、博爱的、激进的、先驱的、保守的、隐居的、入世的、嗜睡的、朋克的、蓝调的、爵士的、认识的、感性的、结构的、解构的、语言的、音乐的长发男。他的主要成分是疯狂、幽默感和表演型人格。很不幸，他的配比失衡，早已病入膏肓了。\n\n不过，用几个词来形容一个人未免太片面了。就像如果让一群欧陆哲学家讨论 Hopf algebra，那么，首先他们对于 unit 的理解是不同的，有人认为这不应该叫 unit，应该叫 mono，还有些人认为应该是 monad，但是 monad 已经被人用了，怎么办呢？他们接着要证明自己才是 monad 的正统，并且把 monoid 也一并抢过来。再然后他们对于 counit 的理解是不同的，接下来，有些人想要保留 associativity，有些人觉得 coassociativity 才是 associativity，甚至有人认为 commutativity 才应该是 coassociativity。再接下来，有人不赞同 bialgebra，而认为 Hopf algbera 应该是一个 quadralgbera，因为要尊重四元素说，接下来开始讨论到底是应该使用希腊源的概念（tetra-），还是拉丁源的概念（quadri-）。哲学正统在古希腊，所以 quadralgbera 是不好的概念，我们应该用 tetralgbera，那么又应该是 tetralgbera 还是 tetra-algbera 呢？这里又有微妙的区别。 我们还是要研究 Hopf，回归到 Hopf 本人的思想，才能真正理解和把握 Hopf algebra 到底应该是一个 tetralgbera 还是 tetra-algbera，我们需要从 Hopf 和朋友的书信中找到证据。仿佛一个人当时忽然灵光一现有了什么可能是正确也可能是错误的想法就可以作为现在我们应该如何理解这个概念的证据一样。\n\n扯远了，总而言之，现在大家就会觉得：这个人是嘉豪吗，一个自我介绍写这么多没用的？不过，有些人可能会觉得用几个形容词来做自我介绍未免太水了，所以我们不免需要走进他的深层世界来一探究竟!\n\n首先来到第一层手机游戏。321 开始程鹭姐吟唱：把她交给我吧，之后我会带她回衙门。没想到我落难关头，遇到的还是把它给我？好！我答应你，我程和光，定会尽我所能，护好这把剑。报信之后，定将它分毫你。你可愿助我？这是我平生最重要之物。此剑便托付于你了。它对你如此重要，你就这样无损地交还到你手上，如有差池，提头来见！这个官，我不做了！我答应过别人护好这把剑。我已错了太多，好在如今，我还有一个承诺能守。你若想得剑，便先杀了我！你不求生路？我只求无悔。你若要来，九死一生。我会来。安排好这边，我便会去找你，你要保重。折就折！做你想做的，我来挡住她！\n\n321宁梁姐吟唱：宁小姐…现在不方便天还凉听说宁小姐最近身体抱恙，应该避免去山上才是如果有空，我陪你去我没有什么好瞒着你的我来取吧，近日看得少，放在高处了梁某人从来都是相信宁小姐的要是让宁小姐不快了，梁某人道歉我一直坚信你我共事，定能跨过千难万阻如果宁小姐只是宁小姐，梁某人怎么会不高兴呢宁小姐……好久不见听说你刚刚回到百灶，我想来见见你我只当是公事，便没有烦扰宁小姐宁小姐怪罪，我无可辩驳可梁某人，对宁小姐总是真心。\n\n■■■■■■■■■■■■\n\n……并非出于自私的隐瞒不该被当作一种欺骗。​你怀疑自己很长一段时间以来的判断和选择出现了错误，并且认为自己是时候放弃一些事情了。​那你现在又在坚持什么呢？\n\n■■■■■■■■■■■■\n\n……没想到现在不想松手的会是我。\n\n我相信我们之间的连接将会超过时间与空间。\n\n就算是海洋沸腾、大气消失；我们的卫星连接坠入重力的漩涡；我们的太阳凶恶的膨胀，无情的吃掉它的孩子直到万籁俱寂……我们也一样能再见面。在那用黑暗和星点光芒装饰过的文明尽头，我们也一样会再见面，一定。\n\n我肯定会等到那一天。等我。你也要等我。\n\n直到时间的尽头，我们跨过了归于静寂的宇宙。\n\n我会在那个世界等你。\n\n……不准忘记我。\n\n■■■■■■■■■■■■\n\n现在大家可能会觉得：这个人是不是有病？神经病啊！没错这个人就是有病。不过大家可能有所不知，实际上在他发病之前，曾经在这里留下了一行神秘代码等待别人破译：\n\n孔明明#0820 ID 94204479\n\n不过我们的探索还没有结束。大家可能想问：为什么还要继续？我已经不想再看下去了。你应该向我支付看这篇自我介绍的费用！因为山就在那里。We choose to go to the moon, not because they are easy, but because they are hard. 所以我们的探索还会继续。接下来让我们探索第二层单机游戏：\n\n正在打丝之歌呢，女朋友发信息说要和我分手，我想发信息敷衍她，打字打到一半却突然停了下来，一种说不上来的感觉涌上了我的心头，是迷茫吗？是不舍吗？我也说不清楚。默默把聊天框里的字都删光，我渐渐陷入了回忆中。还记得刚开始谈恋爱时，省下生活费也要和她一起出去吃饭，一起出去玩。还记得第一次在大庭广众下羞涩地牵手，她的手一直往我这靠却又不敢握住，总是轻轻地摩挲着，最后还是我鼓起胆和她十指相扣。还记得第次拥抱，她柔软的身躯依靠在我的怀里，似乎能感受到互相的心跳。还记得第一次接吻，在那个昏黄路灯照耀下的角落，能感受到对方的鼻息拂过，我和她的脸都红红的。还记得和她一起逛游乐园一起爬山，我们一起嘻嘻哈哈一起欢笑，一起谈天说地畅想未来。还记得和她一起吃饭，她遇到不喜欢的菜总是要嘟嘟囔囔地夹到我的碗里，而我总是要去戳她鼓鼓的脸蛋。还记得她飘扬的长发，总是散发着迷人的香气，多少次在夕阳下无声的依靠，我静静地把玩着她的长发。时间渐渐冲淡了回忆，不知从什么时候开始，那股令人如痴如醉深陷其中的爱意好像逐渐消失了。她问我为什么不经常给她发信息聊天了，我说最近有点忙，其实我可能只是在玩丝之歌。她问我晚上要不要一起吃饭，我说晚上有事，其实我可能只是在玩丝之歌。她问我周未要不要和她出去玩，我说周末我有其他活动，其实我可能只是在玩丝之歌。那天我和她一起肩并肩走在路上，她突然问我为什么都不主动牵她的手了，我不知道该怎么回答，就这么沉默着。也许终究是淡了吧。我默默地打出一个好，结束了这段感情。那一瞬间是不舍吗，是解脱吗，是后悔吗，我说不清楚。电脑还在播放着丝之歌机枢舞者的BGM，那一刻，我突然想明白了。\n\n承受他的意志有多难熬😡我比你更懂😭开！😡😡小猴子，你果然有几分他的影子😊既然如此我也不必留手😠得罪了👏今日替他👈教教后人🤲躲不过这刀，还不如再来过😕不知为何，一见到你😩我就想起很多事情😭😭😭你这猴子真令我欢喜☺️天上那些庸才😡不如我者多👉胜似我者少👈从前他在时🤧就只有他😋值得一战再走生死路😡让我好生羡慕我的三尖两刃刀有些钝了☝🤓正好帮我磨一磨😡你想接他衣钵，这条路……太苦了😫当年他被押去斩妖台，刀砍斧剁，枪刺剑刺，毫发无伤，如今他用自己换回了你来……😭让我试试👆你和他到底有何不同！🙌你，终究不是他😞☝此番想见，是喜呀😏你不在的每一天，我都在想你😘撑不过去，那也不配为齐天大圣🙏法相天地！果真🐵是个好猴子！☝既然帮你，便帮到底罢👐大刀，杀到！👿🔪若敌不住，就教杀了💀太钝了，与你斗……还是这般费力损刀😩😩石头，就得……硬！😓👊😡烧死了，一毛不值，挺得住，才配做……齐天大圣！👏😡现在有十分像你了！😄👍是他赢了……我遣众兄弟一路试你，就是为了这一刻😭那一战后，我今日才明白……😢一世名，锁不住他🏅😫🏅一道箍，捆不住他😖👋💫但愿你，不会辜负他😑\n\n好的现在大家可能会觉得：这个人是受虐狂吗？天天玩这种游戏。我想说不是的，只是因为大家还没来到科大。相比于科大考试，玩丝之歌简直是在放松。好的又扯远了。不过大家可能有所不知，实际上在他发病之前，曾经在这里留下了一行神秘代码等待别人破译：\n\n孔明亲 239997458\n\n好的。那么大家可能已经受不了了，不过我相信能看到这里的人应该也会捏着鼻子看完的吧。所以让我们继续下潜窥探他内心最深处的秘密。第三层是什么呢？相信大家猜也能猜出来。没错就是网络游戏！\n\n上海到巴黎的距离是五年\n很长很长，但不后悔\n\n321秀兵集合秀兵吟唱：\n\n逃不过 相忘江湖之间\n忘不了 惊鸿一眼\n独自卷帘 望寒星几点\n躲不了 岁月催老少年\n寻不到 爱恨缠绵\n既然无缘 寻一场好眠\n\n许哥牛逼！许哥不是区！许哥是2026 EWC世界冠军！\n\n我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，我不会失败，\n\n按照惯例不多废话这里也有神秘代码\n\nhttps://op.gg/lol/summoners/tw/midking-HKUST\nhttps://op.gg/lol/summoners/na/midking-Penn\n\n那么大家既然都看到这里了也无所谓了。不过，大家可能会想，这个人这么欠揍，不怕被揍吗？实际上，只要你不怕被揍，你还可以更加欠揍：说密码学加密解密构成明文空间上的密码置换群，说图形学变换构成欧几里得空间上的仿射变换群，说类型系统构成类型空间上的自同构群。你上瘾了还可以继续：把 UI 称为 State → VDOM 的 Morphism，把 HOC 称为组件范畴上的Endofunctor，把 useState 称为状态空间上的 Comonad，把useContext 称为组件树上的 Reader Monad，把useEffect 称为与外部世界交互的 IO Monad，把 Reducer 称为作用于 Action 列表上的 Catamorphism。\n\n[汤圆][颂乐人偶·眯眼笑]","image":"assets/images/红烧糖醋鲤鱼.webp","color":"#8a9bae"},{"role":"小妈妈","name":"刘多","title":"小妈妈-刘多","group":"mentor","intro":"大家好呀！！我是目前就读于SGFN专业的大二1️⃣组小妈妈-刘多，大家也可以叫我麻吉～喜欢唱歌喜欢手工喜欢动物昆虫也喜欢找人玩！！有任何问题都可以来随时问我（不管是不是跟大学相关的只要我能帮上我都尽量帮忙！）也欢迎各位随时来找我玩！！我的特殊技能是假扮鸵鸟 想学的来找我玩。。欢迎各位来到1️⃣组大家庭，玩得开心哦🥳","image":"assets/images/刘多.webp","color":"#c4a495"},{"role":"组曾奶奶","name":"侯若然Bona","title":"组曾奶奶-侯若然Bona","group":"elder","intro":"大家好！！可以叫我Bona或者小猴😆我来自广州 目前的专业是mgmt和mark 想要练粤语的可以来找我！！我平时喜欢追剧看电影 也很喜欢聊天 是名有点话唠的entp 很期待认识大家！！","image":"assets/images/侯若然Bona.webp","color":"#8a9bae"},{"role":"大妈妈","name":"周佳璇","title":"大妈妈-周佳璇","group":"mentor","intro":"Hellooooo大家好！！我是大妈妈周佳璇😆，来自上海。专业是商学院的ECOF+AI延伸主修。喜欢打篮球，打羽毛球、打排球、游泳、爬山、骑车……运动成瘾者，但是最近受伤了没法玩啦。喜欢的球星是欧文。也喜欢摄影！平时喜欢扫扫街，拍拍人文。此外，还喜欢写书法/看番/旅行/逛博物馆/乐高/桌游……喜欢的音乐也有很多，欢迎来找我聊天！","image":"assets/images/周佳璇.webp","color":"#c4a495"},{"role":"组local","name":"李晓琳","title":"组local-李晓琳","group":"mentor","intro":"大家好！我是你們的組 local 李曉琳，目前在科大讀生物工程大三。👋 非常歡迎大家來到科大！身為 local，我平時最大的興趣就是到處拍照、發掘好玩的地方還有吃美食（跟著我準沒錯！ 📸🍲）。 大學四年的時間說長不長，希望接下來能帶大家一起探索香港的各個角落。不僅想幫大家順利適應科大的生活，更希望四年過去後，你們也會深深愛上香港這座城市！ 接下來的日子請多指教，有任何關於香港或科大的問題，隨時都可以找我喔！✨","image":"assets/images/李晓琳.webp","color":"#c4a495"},{"role":"小妈妈","name":"李昭莹","title":"小妈妈-李昭莹","group":"mentor","intro":"1️⃣點點的组仔女们，大家好！我是组小妈妈李昭莹，来自北京，目前就读于文院的GCS专业，后续打算double/minor另一个商科专业。 我的mbti是esfj，是个超级大e人，本人很好相处，也很喜欢交朋友，欢迎大家多来找我玩～ 我的爱好超级广泛！非常喜欢唱歌听歌，还有打羽毛球、游泳、旅行、摄影等等。由于喜欢的东西很多，也很愿意接触新鲜事物，课余时间喜欢逛逛街吃吃美食，每天都过得     function rememberBgm() {

      const member = visibleMembers[currentMember];
      const track = member ? BGM_BY_MEMBER[member.name] : null;
      const inReader = currentView === "reader";
      musicToggle.hidden = !(track && inReader);
      if (!track || !inReader) {
        pauseBgm();
        return;
      }
      musicToggle.title = `BGM · ${track.title}`;
      musicToggle.setAttribute("aria-label", `播放背景音乐 ${track.title}`);
      if (currentBgmKey !== member.name) {
        loadBgm(member.name, track);
      } else if (!bgmState[member.name].paused && bgmAudio.paused) {
        const attempt = bgmAudio.play();
        if (attempt && typeof attempt.catch === "function") attempt.catch(() => {});
      }
      musicToggle.classList.toggle("is-playing", !bgmAudio.paused);
      musicToggle.setAttribute("aria-pressed", String(!bgmAudio.paused));
    }

    function renderDirectory(groupKey) {
      activeGroup = groupKey;
      visibleMembers = members.filter((member) => member.group === activeGroup);
      const info = groupInfo[activeGroup];
      document.getElementById("directoryTitle").textContent = info.title;
      document.getElementById("directorySubtitle").textContent = `${info.subtitle} · ${visibleMembers.length} MEMBERS`;
      membersGrid.innerHTML = visibleMembers.map((member, index) => `
        <button class="member-card" data-member-index="${index}" aria-label="打开${escapeHtml(member.title)}的自我介绍">
          <span class="card-tape" aria-hidden="true"></span>
          <img class="card-image" src="${member.image}" alt="${escapeHtml(member.title)}的照片" loading="lazy">
          <span class="member-name">${escapeHtml(member.name)}</span>
          <span class="member-role">${escapeHtml(member.role)}</span>
          <span class="member-enter">open journal ↗</span>
        </button>
      `).join("");
    }

    function renderMember(index, direction = "next") {
      if (!visibleMembers.length) renderDirectory(activeGroup);
      currentMember = (index + visibleMembers.length) % visibleMembers.length;
      const member = visibleMembers[currentMember];
      const image = document.getElementById("profileImage");
      const placeholder = document.getElementById("profilePlaceholder");
      const previous = visibleMembers[(currentMember - 1 + visibleMembers.length) % visibleMembers.length];
      const next = visibleMembers[(currentMember + 1) % visibleMembers.length];

      document.getElementById("readerProgress").textContent = `${String(currentMember + 1).padStart(2, "0")} / ${String(visibleMembers.length).padStart(2, "0")}`;
      document.getElementById("profileTitle").textContent = member.title;
      const profileIntro = document.getElementById("profileIntro");
      const readerRight = document.querySelector(".reader-right");
      profileIntro.textContent = member.intro;
      profileIntro.className = "intro-body";
      if (member.intro.length < 100) profileIntro.classList.add("intro-short");
      else if (member.intro.length < 260) profileIntro.classList.add("intro-medium");
      else if (member.intro.length < 700) profileIntro.classList.add("intro-standard");
      else profileIntro.classList.add("intro-long");
      readerRight.classList.toggle("is-brief", member.intro.length < 260);
      document.getElementById("profileCaption").textContent = member.title;
      document.getElementById("prevLabel").textContent = previous.title;
      document.getElementById("nextLabel").textContent = next.title;

      image.onerror = () => {
        image.hidden = true;
        placeholder.hidden = false;
        placeholder.textContent = member.name.slice(0, 1);
        placeholder.style.backgroundColor = member.color;
      };
      image.removeAttribute('src');
      image.alt = `${member.title}的照片`;
      image.hidden = false;
      placeholder.hidden = true;
      image.src = member.image;

      notebook.classList.remove("turn-next", "turn-prev");
      void notebook.offsetWidth;
      notebook.classList.add(direction === "prev" ? "turn-prev" : "turn-next");

      syncBgm();
    }

    function openMember(index) {
      renderMember(Number(index), "next");
      showView("reader");
    }

    document.querySelectorAll("[data-go]").forEach((button) => {
      button.addEventListener("click", () => showView(button.dataset.go));
    });
    document.querySelectorAll("[data-open-group]").forEach((button) => {
      button.addEventListener("click", () => {
        renderDirectory(button.dataset.openGroup);
        showView("directory");
      });
    });
    document.querySelectorAll("[data-pending]").forEach((button) => {
      button.addEventListener("click", () => showNotice(`${button.dataset.pending}的资料尚未加入。`));
    });
    document.querySelectorAll("[data-pending-home]").forEach((button) => {
      button.addEventListener("click", () => showNotice(`${button.dataset.pendingHome} 页面尚未加入。`));
    });
    membersGrid.addEventListener("click", (event) => {
      const card = event.target.closest("[data-member-index]");
      if (card) openMember(card.dataset.memberIndex);
    });
    document.getElementById("prevMember").addEventListener("click", () => renderMember(currentMember - 1, "prev"));
    document.getElementById("nextMember").addEventListener("click", () => renderMember(currentMember + 1, "next"));

    musicToggle.addEventListener("click", () => {
      if (bgmAudio.paused) {
        if (currentBgmKey) bgmState[currentBgmKey].paused = false;
        const attempt = bgmAudio.play();
        if (attempt && typeof attempt.catch === "function") attempt.catch(() => {});
      } else {
        if (currentBgmKey) bgmState[currentBgmKey].paused = true;
        bgmAudio.pause();
      }
    });
    bgmAudio.addEventListener("play", () => {
      musicToggle.classList.add("is-playing");
      musicToggle.setAttribute("aria-pressed", "true");
    });
    bgmAudio.addEventListener("pause", () => {
      musicToggle.classList.remove("is-playing");
      musicToggle.setAttribute("aria-pressed", "false");
      rememberBgm();
    });
    bgmAudio.addEventListener("timeupdate", () => {
      if (currentBgmKey) {
        const st = bgmState[currentBgmKey] || (bgmState[currentBgmKey] = { time: 0, paused: false });
        st.time = bgmAudio.currentTime;
      }
    });
    bgmAudio.addEventListener("loadedmetadata", () => {
      if (pendingBgmSeek) {
        bgmAudio.currentTime = pendingBgmSeek;
        pendingBgmSeek = 0;
      }
    });

    document.addEventListener("keydown", (event) => {
      if (currentView !== "reader") return;
      if (event.key === "ArrowLeft") renderMember(currentMember - 1, "prev");
      if (event.key === "ArrowRight") renderMember(currentMember + 1, "next");
      if (event.key === "Escape") showView("directory");
    });

    renderDirectory("mentor");
    renderMember(0, "next");
    const initialView = location.hash.replace("#", "");
    if (["home", "groups", "directory", "reader"].includes(initialView)) showView(initialView);
  </script>
</body>
</html>
